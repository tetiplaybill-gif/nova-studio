name: NOVA Studio Windows file and network acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-file-network:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - name: Verify Windows file handling and real loopback connections
        shell: pwsh
        run: |
          pnpm exec vitest run --project main --reporter=verbose src/main/services/proxy/__tests__/NodeProxyController.test.ts src/main/services/mediaProtocol/__tests__/MediaProtocolService.test.ts src/main/services/remoteAccess/__tests__/deviceIdentity.test.ts src/main/services/file/utils/__tests__/requestedPath.test.ts src/main/services/file/internal/system/__tests__/clipboard.test.ts src/main/core/preboot/__tests__/userDataLocation.test.ts src/main/services/file/__tests__/FileEditService.test.ts
