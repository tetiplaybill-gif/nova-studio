name: NOVA desktop acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Test the public Network Guard installers in a disposable Windows session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'Only a disposable hosted Windows runner is supported' }
          $admin = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $admin.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'An elevated ephemeral Windows session is required' }
          $reg = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\nova-network-guard'
          $wvreg = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $runtime = (Get-ItemProperty -LiteralPath $wvreg -ErrorAction SilentlyContinue).pv
          if (-not $runtime) { throw 'The hosted OS does not have the registered WebView2 runtime' }
          $root = Join-Path $env:RUNNER_TEMP ('nova-guard-qa-' + [guid]::NewGuid().ToString('N'))
          $dest = Join-Path $root 'install'
          $foreign = Join-Path $root 'unrelated\nova.exe'
          if ((Test-Path $reg) -or (Test-Path $dest) -or (Test-Path "$env:APPDATA\nova") -or (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\NOVA")) { throw 'An existing live NOVA install was found' }
          New-Item -ItemType Directory -Path (Split-Path $foreign) | Out-Null
          function Fetch($version,$expected) {
            $file = "nova-v$version-windows-x64-setup.exe"
            $local = Join-Path $root $file
            Invoke-WebRequest -Uri "https://cdkai.cc/downloads/nova/$version/$file" -OutFile $local
            if ((Get-FileHash $local -Algorithm SHA256).Hash -ne $expected) { throw "Incorrect public installer $version" }
            return $local
          }
          function Install($setup) {
            $p = Start-Process -FilePath $setup -ArgumentList "/S /D=$dest" -PassThru
            if (-not $p.WaitForExit(90000)) { throw 'Installer did not exit' }
            return $p.ExitCode
          }
          function Matches($version) {
            $r = Get-ItemProperty -LiteralPath $reg
            if ($r.DisplayVersion -ne $version -or $r.InstallLocation -ne $dest) { throw "Incorrect registry version or install directory for $version" }
            $out = Join-Path $root ('cli-' + $version + '.txt')
            $p = Start-Process (Join-Path $dest 'nova.exe') -ArgumentList '--version' -RedirectStandardOutput $out -PassThru
            if (-not $p.WaitForExit(30000) -or $p.ExitCode -ne 0 -or (Get-Content -Raw $out).Trim() -ne "nova $version") { throw "Incorrect installed executable version $version" }
            if (-not (Test-Path (Join-Path $dest 'WebView2Loader.dll'))) {throw 'Missing WebView loader'}
          }
          $old = Fetch '3.22.0' 'ceb77475a9ce2be7a3d1a1b5ea064470706afb0a87ebcbe156df41c6e45d30a2'
          $new = Fetch '3.22.1' 'e892e155128ec907a730569f18930db4a7e9c3962f6ca620c49abf976f73b605'
          Write-Host "OS $([Environment]::OSVersion.Version) WebView2 $runtime; both public installers verified"
          if ((Install $old) -ne 0) {throw 'Initial installation failed'}
          Matches '3.22.0'
          Copy-Item -LiteralPath "$env:SystemRoot\System32\ping.exe" -Destination $foreign
          $other = Start-Process $foreign -ArgumentList '-t','127.0.0.1' -WindowStyle Hidden -PassThru
          try {
            $exe = Join-Path $dest 'nova.exe'
            $before = (Get-FileHash $exe).Hash
            $lock = [IO.File]::Open($exe,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
            try { $refused = Install $new } finally { $lock.Dispose() }
            if ($refused -eq 0 -or (Get-FileHash $exe).Hash -ne $before -or $other.HasExited) { throw 'Busy upgrade did not fail safely' }
            Matches '3.22.0'
            Write-Host 'Busy installed executable refused; old bytes and unrelated process preserved'
            if ((Install $new) -ne 0 -or $other.HasExited) {throw 'Closed upgrade failed or stopped the unrelated process'}
            Matches '3.22.1'
            $out=Join-Path $root 'ipv6.json'
            $p=Start-Process $exe -ArgumentList '--ipv6-status' -RedirectStandardOutput $out -PassThru
            if (-not $p.WaitForExit(30000) -or $p.ExitCode -ne 0) {throw 'IPv6 read-only query failed'}
            $state=Get-Content -Raw $out | ConvertFrom-Json
            if ($state.status -notin @('enabled','disabled','unknown')) {throw 'Unexpected IPv6 status schema'}
            Write-Host "Installed 3.22.1 and verified native CLI, registered target, read-only IPv6 query; unrelated process survived"
            $uninstaller = Join-Path $dest 'uninstall.exe'
            $p=Start-Process $uninstaller -ArgumentList '/S' -PassThru
            if (-not $p.WaitForExit(90000)) {throw 'Uninstall launcher timed out'}
            $deadline=(Get-Date).AddSeconds(60)
            while (((Test-Path $exe) -or (Test-Path $reg)) -and (Get-Date) -lt $deadline) {Start-Sleep -Milliseconds 500}
            if ((Test-Path $exe) -or (Test-Path $reg) -or $other.HasExited) {throw 'Uninstall did not remove its own target or interfered with the unrelated process'}
            Write-Host 'NOVA_GUARD_WINDOWS_HOSTED_PASS: installer, busy-file refusal, upgrade, native CLI, isolated uninstall, unrelated process'
          } finally {
            if (-not $other.HasExited) { $other.Kill();$other.WaitForExit(5000) | Out-Null }
          }
