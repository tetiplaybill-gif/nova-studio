name: NOVA Windows engine verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-engine:
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild:node
      - name: Verify engine history without a paid provider
        run: pnpm exec vitest run --maxWorkers=1 --silent=true packages/agent-runtime-claude-code/tests/runtime.test.ts -t 'archive|native'
      - name: Verify Windows tool lifecycle and process ownership
        if: success() || failure()
        run: pnpm exec vitest run --maxWorkers=1 --silent=true src/main/utils/__tests__/commandResolver.cancel.test.ts packages/agent-runtime-acp/tests/lifecycle.test.ts src/main/ai/runtime/claudeCode/__tests__/ClaudeCodeProcessManager.test.ts src/main/services/binaryManager/__tests__/pipDependencies.test.ts src/main/services/binaryManager/__tests__/BinaryManager.installedSizes.test.ts
