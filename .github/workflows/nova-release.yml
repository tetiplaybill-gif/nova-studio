name: NOVA Windows save dialog verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-dialog:
    runs-on: windows-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - name: Verify the real Windows suggested Save path in three independent profiles
        shell: pwsh
        env:
          NOVA_RELEASE_TEST_GROUP: isolated
        run: |
          1..3 | ForEach-Object {
            pnpm exec vitest run --project scripts --maxWorkers=1 scripts/e2e/regression/__tests__/nativeAdapters.test.ts -t save-suggested
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
