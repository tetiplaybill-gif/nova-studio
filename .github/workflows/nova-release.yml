name: NOVA Studio Windows packaged startup diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-file-network:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - name: Build the signed-out Windows application
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: node scripts/release/prepare-tools.js prepare windows x64
      - run: pnpm exec electron-builder --dir --win --x64 --publish never
      - name: Verify the real Windows renderer
        shell: pwsh
        run: node scripts/release/verify-note-renderer.cjs (Resolve-Path 'dist/win-unpacked/NOVA Studio.exe').Path
