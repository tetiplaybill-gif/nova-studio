name: Inspect Windows notification shell on a disposable runner
on:
  push:
    branches: [codex/studio-windows-shell-check]
permissions: {}
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable runner required' }
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class DesktopProbe {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern void keybd_event(byte key, byte scan, uint flags, UIntPtr extra);
          }
          '@
          function Read-Foreground {
            $hwnd = [DesktopProbe]::GetForegroundWindow()
            if ($hwnd -eq [IntPtr]::Zero) { return 'none' }
            $e = [Windows.Automation.AutomationElement]::FromHandle($hwnd)
            $c = $e.Current
            $proc = (Get-Process -Id $c.ProcessId).ProcessName
            $line = 'process=' + $proc + ' class=' + $c.ClassName
            if ($proc -notin @('ShellExperienceHost','ShellHost','explorer','StartMenuExperienceHost','SearchHost')) { return $line }
            $line += ' root=' + $c.Name + ' id=' + $c.AutomationId
            $children = $e.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            $ids = foreach ($child in $children) { if ($child.Current.AutomationId) { $child.Current.AutomationId } }
            return $line + ' controls=' + (($ids | Select-Object -Unique -First 22) -join ',')
          }
          function Toggle-Center {
            [DesktopProbe]::keybd_event(0x5b,0,0,[UIntPtr]::Zero)
            try { [DesktopProbe]::keybd_event(0x4e,0,0,[UIntPtr]::Zero) } finally {
              [DesktopProbe]::keybd_event(0x4e,0,2,[UIntPtr]::Zero)
              [DesktopProbe]::keybd_event(0x5b,0,2,[UIntPtr]::Zero)
            }
          }
          $system = Get-CimInstance Win32_OperatingSystem
          Write-Host "Desktop evidence OS=$($system.Caption) build=$($system.BuildNumber) productType=$($system.ProductType) versionAPI=$([Environment]::OSVersion.Version)"
          Write-Host "Desktop evidence before=$(Read-Foreground)"
          Toggle-Center
          try {
            foreach ($i in 1..3) {
              Start-Sleep -Seconds 1
              Write-Host "Desktop evidence after $i = $(Read-Foreground)"
            }
          } finally { Toggle-Center }
